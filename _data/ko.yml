evaluation:
  show: false
  order: 13
  title: 자기 평가
  description: |
    자기 평가는 자신의 강점, 약점, 성장 방향을 간단히 정리하는 섹션입니다. 보유한 역량이 지원하는 역할과 어떻게 맞닿아 있는지를 짧게 설명하는 데 활용할 수 있습니다.

    주요 성과, 전문 분야, 차별화되는 경험을 강조할 수 있으며, 앞으로 더 발전시키고 싶은 영역을 함께 적어도 좋습니다.

certificate:
  show: false
  order: 6
  title: 자격 및 인증
  description: |
    자격 및 인증 섹션은 추가적인 전문성이나 교육 이수 내역을 보여줄 수 있는 공간입니다. 직무와 관련된 인증을 정리하면 지원자의 기술 수준과 학습 의지를 더 명확하게 전달할 수 있습니다.

    온라인 강의, 워크숍, 전문 교육 과정 등 다양한 출처의 인증을 포함할 수 있습니다. 특정 기술, 산업 도메인, 혹은 직무 역량과 직접 연결되는 항목을 중심으로 선별하는 것이 좋습니다.

    이 섹션에는 인증명, 발급 기관, 발급 시점, 필요 시 간단한 설명을 함께 적을 수 있습니다.

  items:
    - name: Example Certificate One
      issuer: by Example
      date: 2020
      link: '#'
      description: |
        Example에서 발급한 예시 인증서입니다.
    - name: Example Certificate Two

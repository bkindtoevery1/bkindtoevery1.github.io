profile:
  show: false
  order: 1
  title: 소개
  description: |
    성장과 탁월함을 향한 강한 의지를 바탕으로, 개인적·전문적 발전의 모든 기회를 놓치지 않으려 노력해 왔습니다. 3년간 문제 해결 역량을 집중적으로 다져 왔고, 2년간 사이버 보안 분야를 경험하며 끈기와 실무 역량을 함께 쌓았습니다. 이제 다음 단계에서는 인공지능 분야의 가능성을 탐구하며, 변화의 흐름에 의미 있게 기여하는 엔지니어로 성장하고자 합니다.


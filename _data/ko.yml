    - company: Republic of Korea Air Force (ROKAF)
      tags: 정규직
      date: 2022.03 - 2023.12
      role: 사이버 보안 담당
      location: 서울, 대한민국
      description: |
        + 24시간 365일 모니터링으로 서버를 공격으로부터 보호했습니다.
        + Firewall, IPS, NAC를 활용해 의심 IP를 차단하고 보안 사고를 예방했습니다.
        + TCP dump와 레지스트리 수집 프로그램을 사용해 침해 장비의 증거를 확보했습니다.
        + 여단 내 전자 장비 전반을 관리했습니다.
        + 예기치 않은 사고와 장애를 빠르고 명확하게 해결했습니다.

    - company: Devsisters
      link: 'https://www.devsisters.com/'
      tags: 인턴십
      date: 2021.01 - 2021.07
      role: 데이터 플랫폼 엔지니어
      location: 서울, 대한민국
      description: |
        + AWS EC2/S3, Kubernetes를 활용해 대규모 사용자 게임 데이터를 데이터 웨어하우스로 전달하는 파이프라인을 운영했습니다.
        + Airflow, Kafka, ELK Stack 기반으로 데이터를 자동 전처리하고, 데이터 소비자에게 준실시간으로 전달하는 파이프라인을 구축했습니다.


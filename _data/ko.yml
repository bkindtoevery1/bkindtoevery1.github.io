patent:
  show: false
  order: 9
  title: 특허
  description: |
    특허 섹션은 보유 중이거나 출원 중인 특허를 정리하는 공간입니다. 과학, 공학, 기술 기반 직무에서는 연구 개발 역량과 문제 해결 능력을 보여주는 데 도움이 됩니다.

    이 섹션에는 특허명, 발명자, 특허 번호, 출원일과 등록일 등을 정리할 수 있습니다. 출원 중인 경우에는 "출원 중" 또는 "심사 중"과 같이 상태를 표시하면 됩니다.

    특허가 없다면 이 섹션은 생략해도 무방합니다.

